<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WA Gateway — API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --fg: #0f0f0f;
      --muted: #6b6b6b;
      --border: #e8e8e8;
      --accent: #25d366;
      --font-head: 'Poppins', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }
    html, body { max-width: 100vw; overflow-x: hidden; }
    body { font-family: var(--font-body); background: #fff; -webkit-font-smoothing: antialiased; }

    /* Navbar */
    nav {
      position: sticky;
      top: 1rem;
      z-index: 200;
      display: flex;
      justify-content: center;
      padding: 0 1.5rem;
      margin-bottom: 1rem;
    }
    .nav-inner {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 2.5rem;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-head); font-weight: 700; font-size: 1rem;
      color: var(--fg); text-decoration: none; flex-shrink: 0;
    }
    .nav-logo .logo-icon {
      width: 30px; height: 30px; background: var(--accent);
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 14px;
    }
    .nav-links { display: flex; align-items: center; gap: 2rem; flex: 1; justify-content: center; }
    .nav-links a { font-size: 0.875rem; color: var(--muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--fg); }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.1rem; border-radius: 9999px;
      font-size: 0.8125rem; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease;
      cursor: pointer; border: none; font-family: var(--font-body);
    }
    .btn-dark { background: #0f0f0f; color: #fff; }
    .btn-dark:hover { background: #1a1a1a; }
    .btn-outline { background: transparent; color: var(--fg); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: #999; background: #f5f5f5; }

    /* Swagger overrides */
    .topbar { display: none !important; }
    .swagger-ui .info { margin: 2rem 0 1.5rem; }
    .swagger-ui .info .title { font-family: var(--font-head) !important; font-weight: 800 !important; font-size: 2rem !important; color: var(--fg) !important; }
    .swagger-ui .scheme-container { background: #f7f7f7; border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.5rem; }
    .swagger-ui select { border-radius: 9999px !important; border: 1.5px solid var(--border) !important; }
    .swagger-ui .btn { border-radius: 9999px !important; }
    .swagger-ui .opblock-tag { font-family: var(--font-head) !important; font-weight: 700 !important; }

    #swagger-ui { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    @media (max-width: 768px) {
      .nav-links, .nav-actions { display: none; }
      .nav-inner { justify-content: space-between; gap: 1rem; width: 100%; }
      .hamburger { display: flex; }
    }
    @media (min-width: 769px) {
      .hamburger { display: none; }
    }
    .hamburger {
      background: none; border: none; cursor: pointer; color: var(--fg); align-items: center; justify-content: center;
    }
    .mobile-menu {
      display: none; flex-direction: column; gap: 1rem; padding: 1.5rem;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 1.5rem; margin-top: 0.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center;
      width: calc(100% - 3rem); margin-left: 1.5rem; margin-right: 1.5rem;
    }
    .mobile-menu.active { display: flex; }
    .mobile-menu a { font-size: 0.875rem; color: var(--muted); text-decoration: none; font-weight: 500; }
    .mobile-menu a:hover { color: var(--fg); }
  </style>
</head>
<body>

  <nav style="display: flex; flex-direction: column; align-items: center; max-width: 900px; margin: 0 auto; width: 100%;">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">📱</div>
        WA Gateway
      </a>
      <div class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="index.html#quickstart">Quick Start</a>
        <a href="api-docs.html" style="color:#0f0f0f;font-weight:600;">API Docs</a>
      </div>
      <div class="nav-actions">
        <a href="main-dashboard.html" class="btn btn-dark">Dashboard →</a>
      </div>
      <button class="hamburger" onclick="document.getElementById('api-mobile-menu').classList.toggle('active')">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <div id="api-mobile-menu" class="mobile-menu">
      <a href="index.html#features">Features</a>
      <a href="index.html#how-it-works">How it works</a>
      <a href="index.html#quickstart">Quick Start</a>
      <a href="api-docs.html" style="color:#0f0f0f;font-weight:600;">API Docs</a>
      <a href="main-dashboard.html" class="btn btn-dark" style="justify-content: center; margin-top: 0.5rem;">Dashboard →</a>
    </div>
  </nav>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: 'swagger.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
