# Run alongside docker-compose.yml: docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d
# !override requires Docker Compose 2.24.4+. The deployment verifies support before switching.
services:
  wagateway:
    image: nusa-todo-release:20261027
    ports: !override
      - "127.0.0.1:3030:3030"
    env_file:
      - .env
    environment:
      DB_HOST: mysql_db
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-simrs_wa}
      PUBLIC_ORIGIN: https://20.214.155.243
    volumes:
      - ./public:/app/public:ro
      - ./scripts:/app/scripts:ro
      - ./todo-service.js:/app/todo-service.js:ro
      - ./todo-time.js:/app/todo-time.js:ro
      - ./todo-chat.js:/app/todo-chat.js:ro
      - ./migrate-todolist.js:/app/migrate-todolist.js:ro
      - ./web-auth.js:/app/web-auth.js:ro
      - ./wa-media.js:/app/wa-media.js:ro
      - ./main-dashboard.html:/app/main-dashboard.html:ro
    security_opt:
      - no-new-privileges:true
  mysql_db:
    ports: !override
      - "127.0.0.1:3307:3306"
  https:
    image: caddy:2.11.2
    container_name: gateway_https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wagateway
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
    external: true
    name: nusa_caddy_data
  caddy_config:
    external: true
    name: nusa_caddy_config
